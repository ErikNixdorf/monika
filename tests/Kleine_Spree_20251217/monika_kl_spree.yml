# This File allows to define how to read the equipment from monika during a campaign and to visualize and export joined results
info:
    campaign: Kleine_Spree_20251217
    time_zone: Europe/Berlin
    coordinate_system : 25833
    contact: Erik Nixdorf
    data_dir: tests\ # all data is located relativ to this path and considering that next level dir is named after the campaign
#input describes the location of all input datasets as well as parameter specifications
devices:
    ltc_left:
        type: logger
        fabricate: solinst_ltc
        file_name: monika_left.lev
        config:
               ec_lim: 
                    - 50
                    - 5000
               data_separator: "\\s+"
               rows_to_skip: 48
               temperature_correction_factor: 0.019
               timeshift: 0
    ltc_right:
        type: logger
        fabricate: solinst_ltc
        file_name: monika_right.lev
        config:
               ec_lim: 
                    - 50
                    - 5000
               data_separator: "\\s+"
               rows_to_skip: 48
               temperature_correction_factor: 0.019
               timeshift: 0  
    deeper_1:
        type: deeper
        fabricate: deeper_chirp3+
        file_name: deeper_kleine_spree.csv
        sonar:
               use_sonar_reflection_data: true
               sonar_config:
               file_name: sonar.csv
               pixel_resolution: 0.0025
               min_water_depth : 0.1
               resample_resolution : 1s
output:
    plot_1:
        type: trajectory
        config:
            gps_to_use: deeper_1
            background_image: study_site.tif
            label_interval : 1 # in seconds
            parameter: temp
            device_name: all
            location_cols : 
                - HW
                - RW
    plot_2:
        type: trajectory
        config:
            gps_to_use: deeper_1
            background_image: study_site.tif
            label_interval : 1 # in seconds
            parameter: EC25
            device_name: all
            location_cols : 
                - HW
                - RW
    plot_3:
        type: timeseries
        config:
            label_interval : 100 # in meter
            parameter: EC25
            device_name: all
            remove_entries_with_no_location: true
            location_cols : 
                - HW
                - RW
    plot_4:
        type: sonar_strength
        device_name: deeper_1            